# Cluster settings for experiments/cluster.sh (sourced by bash; no secrets here).
# Personal overrides: ~/.config/mero/cluster.conf (or $MERO_CLUSTER_CONF).
# ssh details (user, jump host, ControlMaster) belong in ~/.ssh/config under this alias:
CLUSTER_HOST=mero
# Shared storage visible from the compute nodes; NOT the home directory (5 GB quota).
REMOTE_RUNS=/vol/tcm02/bagrov_storage/mero
# Where `cluster.sh fetch` puts results on the machine you run it on:
LOCAL_RESULTS="$HOME/mero-results"
PARTITION=tcm
PYTHON=python3
# REPO_URL defaults to `git remote get-url origin`; the cluster clones it read-only.
